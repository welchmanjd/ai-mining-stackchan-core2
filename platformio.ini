; PlatformIO Project Configuration File

[platformio]
default_envs = m5stack-core2

[env]
platform = espressif32
board = m5stack-core2
framework = arduino
extra_scripts =
  pre:tools/pio_build_id.py

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
monitor_dtr = 0
monitor_rts = 0

upload_speed = 921600
upload_flags =
  --connect-attempts=20

board_build.f_cpu = 240000000L
board_build.flash_mode = dio
board_build.f_flash = 80000000L

lib_deps =
  m5stack/M5Unified@0.1.16
  meganetaaan/M5Stack-Avatar@0.9.2
  madhephaestus/ESP32Servo
  arminjo/ServoEasing
  ArduinoJson

[env:m5stack-core2]
extends = env
build_type = debug
; Log level guide:
;   0 = QUIET  : Error only
;   1 = NORMAL : + Warn/Info
;   2 = DIAG   : + Debug, EVT_DEBUG_ENABLED=1 (default)
;   3 = TRACE  : + Trace, TOUCH_DEBUG_ENABLED=1 (default)
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DMC_LOG_LEVEL=3
monitor_filters = esp32_exception_decoder, time, send_on_enter
monitor_echo = yes

[env:m5stack-core2-dist]
extends = env:m5stack-core2
build_type = release
build_unflags =
  -DMC_LOG_LEVEL=3
; Public/dist build:
;   disable private config include and keep logs quiet.
build_flags =
  -DMC_DISABLE_CONFIG_PRIVATE=1
  -DCORE_DEBUG_LEVEL=0
  -DMC_LOG_LEVEL=0
  -O3
  -fno-if-conversion

